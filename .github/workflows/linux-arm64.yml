# Adds a Linux arm64 (aarch64) build to the WGTunnel CI.
# Proposed file: .github/workflows/package-linux-arm64.yml
# (at the root of wgtunnel/desktop)
#
# Builds deb/rpm/pacman/tar for aarch64.
# Uses a native arm64 runner (Ubuntu 24.04 ARM64) because GraalVM
# native-image cannot cross-compile x86 -> ARM.
#
# IMPORTANT: upstream currently lacks the fixes needed for arm64, so this
# workflow applies them automatically (material3 pin, Makefile targets,
# keyring task, JVM-only exclusions, PGP off, core built from source).
# The patch patterns mirror the local build that produced a working arm64
# deb/tar.gz. If an upstream file drifts, a pattern simply won't match and
# prints a warning; the build will then fail loudly, not silently.
#
# Important: release.yml (the main workflow) should call this via
# workflow_call, or artifacts can be fetched from CI manually.

name: package-linux-arm64

on:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        required: false
        default: nucleus-3.0
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion"
        type: string
        default: "0.0.0"
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        default: nucleus-3.0

permissions:
  contents: read

jobs:
  package:
    name: package-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wgtunnel/core
          path: core
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: wgtunnel/desktop
          path: desktop
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: NucleusFramework/Nucleus
          ref: ${{ inputs.nucleus_ref || 'nucleus-3.0' }}
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          packaging-tools: "true"
          setup-gradle: "true"
          graalvm: "true"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patch patchelf zlib1g-dev npm openjdk-21-jdk-headless

      # ---------------------------------------------------------------
      # Patch core (wgtunnel/core) for linux-arm64 and publish it locally.
      # ---------------------------------------------------------------
      - name: Patch core for linux-arm64
        working-directory: core
        run: |
          python3 - <<'PY'
          import pathlib

          # 1) settings.gradle.kts: exclude Android-only modules
          p = pathlib.Path('settings.gradle.kts')
          s = p.read_text()
          s = s.replace('include(":hevtunnel")', '// disabled-for-arm64: include(":hevtunnel")')
          s = s.replace('include(":backend-android-jni")', '// disabled-for-arm64: include(":backend-android-jni")')
          p.write_text(s)

          # 2) backend/build.gradle.kts: strip Android plugin/target/sourceSet, PGP off
          p = pathlib.Path('backend/build.gradle.kts')
          b = p.read_text()
          b = b.replace('    alias(libs.plugins.android.kotlin.multiplatform.library)',
                        '    // disabled-for-arm64: alias(libs.plugins.android.kotlin.multiplatform.library)')

          def drop_block(text, start, end):
              out, skipping = [], False
              for ln in text.split('\n'):
                  if not skipping and ln == start:
                      skipping = True
                      continue
                  if skipping:
                      if ln == end:
                          skipping = False
                      continue
                  out.append(ln)
              return '\n'.join(out)

          b = drop_block(b, '    android {', '    }')
          b = drop_block(b, '        androidMain.dependencies {', '        }')
          p.write_text(b)

          # PGP signing off for local publishing (backend + parser + any other .kts)
          for f in pathlib.Path('.').rglob('*.kts'):
              txt = f.read_text()
              if 'signAllPublications()' in txt:
                  f.write_text(txt.replace('signAllPublications()', '// disabled-for-arm64: signAllPublications()'))

          # 3) backend/native/backend/Makefile: arm64-only + rule + rewrite
          #    copy_to_resources for the arm64-only build
          p = pathlib.Path('backend/native/backend/Makefile')
          m = p.read_text()
          m = m.replace('PLATFORMS := linux-amd64 windows-amd64', 'PLATFORMS := linux-arm64')
          idx = m.index('$(DESTDIR)/libwg-linux-amd64.so:')
          end = m.index('\n\n', idx)
          block = m[idx:end]
          arm_block = block.replace('linux-amd64', 'linux-arm64').replace('GOARCH=amd64', 'GOARCH=arm64')
          if 'libwg-linux-arm64.so:' not in m:
              m = m[:end] + '\n' + arm_block + m[end:]
          start = m.index('copy_to_resources: build_all')
          clean_idx = m.index('\nclean:', start)
          new_c2r = (
              'copy_to_resources: build_all\n'
              '\t@mkdir -p "$(RESOURCEDIR)/linux-aarch64"\n'
              '\t@cp "$(DESTDIR)/libwg-linux-arm64.so" "$(RESOURCEDIR)/linux-aarch64/libwg.so"\n'
              '\t@echo "Copied linux-arm64 -> $(RESOURCEDIR)/linux-aarch64/libwg.so"\n'
          )
          if 'linux-aarch64' not in m:
              m = m[:start] + new_c2r + m[clean_idx:]
          p.write_text(m)
          print("core patched ok")
          PY

      - name: Publish core to Maven Local (JVM, arm64)
        working-directory: core
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      # ---------------------------------------------------------------
      # Patch desktop (wgtunnel/desktop) and run the packaging.
      # ---------------------------------------------------------------
      - name: Patch desktop for linux-arm64
        working-directory: desktop
        run: |
          python3 - <<'PY'
          import pathlib

          # 1) gradle/libs.versions.toml: core version + material3 pin
          p = pathlib.Path('gradle/libs.versions.toml')
          t = p.read_text()
          t = t.replace('core = "1.10.0"', 'core = "1.10.1"')
          t = t.replace('material3 = "1.13.0-beta01"', 'material3 = "1.12.0-alpha03"')
          p.write_text(t)

          # 2) keyring/tools/keyring-go/Makefile: arm64 rule
          p = pathlib.Path('keyring/tools/keyring-go/Makefile')
          m = p.read_text()
          m = m.replace('PLATFORMS := linux-amd64 windows-amd64', 'PLATFORMS := linux-arm64')
          idx = m.index('$(DESTDIR)/libkeyring-linux-amd64.so:')
          end = m.index('\n\n', idx)
          block = m[idx:end]
          arm_block = block.replace('linux-amd64', 'linux-arm64').replace('GOARCH=amd64', 'GOARCH=arm64')
          if 'libkeyring-linux-arm64.so:' not in m:
              m = m[:end] + '\n' + arm_block + m[end:]
          p.write_text(m)

          # 3) Keyring Gradle task: build only linux-arm64 (make all tries
          #    Windows cross-builds and fails without mingw).
          for f in pathlib.Path('.').rglob('*.kt'):
              txt = f.read_text()
              if 'commandLine("make", "all")' in txt:
                  f.write_text(txt.replace(
                      'commandLine("make", "all")',
                      'commandLine("make", "copy_to_resources", "PLATFORMS=linux-arm64")',
                  ))
                  print('patched keyring task:', f)
          print("desktop patched ok")
          PY

      - name: Package Linux arm64 (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :composeApp:packageGraalvmDeb \
            :composeApp:packageGraalvmRpm \
            :composeApp:packageGraalvmPacman \
            :composeApp:packageGraalvmTar \
            --no-daemon --stacktrace \
            -Papp.variant=${{ inputs.variant }} \
            -Papp.version=${{ inputs.version }} \
            -Papp.packageVersion=${{ inputs.package_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-Linux-arm64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.deb
            desktop/composeApp/build/compose/binaries/**/*.rpm
            desktop/composeApp/build/compose/binaries/**/*.pacman
            desktop/composeApp/build/compose/binaries/**/*.pkg.tar.zst
            desktop/composeApp/build/compose/binaries/**/*.tar.gz
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
