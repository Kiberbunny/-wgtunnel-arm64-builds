# Adds a Linux arm64 (aarch64) build to the WGTunnel CI.
# Proposed file: .github/workflows/package-linux-arm64.yml
# (at the root of wgtunnel/desktop)
#
# Builds deb/rpm/pacman/tar for aarch64.
# Uses a native arm64 runner (Ubuntu 24.04 ARM64) because GraalVM
# native-image cannot cross-compile x86 -> ARM.
#
# Important: release.yml (the main workflow) should call this via
# workflow_call, or artifacts can be fetched from CI manually.

name: package-linux-arm64

on:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        required: false
        default: main
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion"
        type: string
        default: "0.0.0"
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        default: main

permissions:
  contents: read

jobs:
  package:
    name: package-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: NucleusFramework/Nucleus
          ref: ${{ inputs.nucleus_ref || 'main' }}
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          packaging-tools: "true"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Package Linux arm64 (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :composeApp:packageGraalvmDeb \
            :composeApp:packageGraalvmRpm \
            :composeApp:packageGraalvmPacman \
            :composeApp:packageGraalvmTar \
            --no-daemon --stacktrace \
            -Papp.variant=${{ inputs.variant }} \
            -Papp.version=${{ inputs.version }} \
            -Papp.packageVersion=${{ inputs.package_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-Linux-arm64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.deb
            desktop/composeApp/build/compose/binaries/**/*.rpm
            desktop/composeApp/build/compose/binaries/**/*.pacman
            desktop/composeApp/build/compose/binaries/**/*.pkg.tar.zst
            desktop/composeApp/build/compose/binaries/**/*.tar.gz
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
